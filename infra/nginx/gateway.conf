# Single entry point for the browser (decision D7): same origin for the SPA and both GraphQL APIs,
# round-robin over two instances of each service, WebSocket upgrade for subscriptions.

upstream user_service {
    server user-service-1:4000 max_fails=3 fail_timeout=5s;
    server user-service-2:4000 max_fails=3 fail_timeout=5s;
}

upstream chat_service {
    server chat-service-1:4100 max_fails=3 fail_timeout=5s;
    server chat-service-2:4100 max_fails=3 fail_timeout=5s;
}

upstream web {
    server web:80;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    add_header x-gateway nginx always;

    location = /users/graphql {
        proxy_pass http://user_service/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location = /users/health {
        proxy_pass http://user_service/health;
    }

    # HTTP queries/mutations and the graphql-ws subscription transport share this path.
    location = /chat/graphql {
        proxy_pass http://chat_service/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # $http_host keeps the port so the browser Origin (localhost:8080) and Host stay consistent
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # keep idle WebSockets open; graphql-ws pings keep them alive anyway
        proxy_send_timeout 3600s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location = /chat/health {
        proxy_pass http://chat_service/health;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
    }
}
