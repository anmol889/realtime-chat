# Whole system, locally, with 2 instances of each backend behind an nginx gateway.
#   docker compose up --build        ->  http://localhost:8080
# See docs/IMPLEMENTATION_PLAN.md (section 7) and README.md for the topology rationale.
#
# Startup order (all health/completion gated):
#   postgres, redis -> user-migrate, chat-migrate (one-shot `prisma migrate deploy`)
#   -> user-service-1/2, chat-service-1/2 -> web -> gateway
# Migrations run exactly once, in a dedicated job, so two instances booting together never race.

x-user-service: &user-service
  image: realtime-chat/user-service:local
  build: { context: ., dockerfile: apps/user-service/Dockerfile }
  environment: &user-env
    NODE_ENV: production
    PORT: "4000"
    DATABASE_URL: postgresql://chat:chat@postgres:5432/users?schema=public
  depends_on:
    postgres: { condition: service_healthy }
    user-migrate: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s
  restart: unless-stopped

x-chat-service: &chat-service
  image: realtime-chat/chat-service:local
  build: { context: ., dockerfile: apps/chat-service/Dockerfile }
  environment: &chat-env
    NODE_ENV: production
    PORT: "4100"
    DATABASE_URL: postgresql://chat:chat@postgres:5432/chat?schema=public
    REDIS_URL: redis://redis:6379
    # Service-to-service calls go through the same gateway, so they are load balanced too.
    USER_SERVICE_URL: http://gateway/users/graphql
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    chat-migrate: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- one-shot migration jobs (same image as the service, different command) ----
  user-migrate:
    image: realtime-chat/user-service:local
    build: { context: ., dockerfile: apps/user-service/Dockerfile }
    environment: *user-env
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  chat-migrate:
    image: realtime-chat/chat-service:local
    build: { context: ., dockerfile: apps/chat-service/Dockerfile }
    environment: *chat-env
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # ---- two named instances of each backend ----
  user-service-1:
    <<: *user-service
    environment: { <<: *user-env, INSTANCE_ID: user-1 }

  user-service-2:
    <<: *user-service
    environment: { <<: *user-env, INSTANCE_ID: user-2 }

  chat-service-1:
    <<: *chat-service
    environment: { <<: *chat-env, INSTANCE_ID: chat-1 }

  chat-service-2:
    <<: *chat-service
    environment: { <<: *chat-env, INSTANCE_ID: chat-2 }

  web:
    image: realtime-chat/web:local
    build: { context: ., dockerfile: apps/web/Dockerfile }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 12

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      user-service-1: { condition: service_healthy }
      user-service-2: { condition: service_healthy }
      chat-service-1: { condition: service_healthy }
      chat-service-2: { condition: service_healthy }
      web: { condition: service_healthy }

volumes:
  pgdata:
